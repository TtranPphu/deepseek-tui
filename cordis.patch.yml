# deepseek-tui bundle patch: the terminal UI over the dsh-base layer.
# Rows reference this package by name, so the package must be resolvable from
# the profile — install it with `dsh plugin --profile tui add <pkg>`, or point
# a profile dependency at this checkout (`"deepseek-tui": "file:../tui"`)
# during development.

- insert:
    # The app's command-line provider: injects `cmdlineArgs` and provides
    # `tuiStartup` as an ordinary Cordis service. The app row below injects
    # that service, so the Loader resolves it only after a clean parse —
    # `dsh --profile tui --help` and usage errors provide nothing and request
    # the launcher's exit, so the UI never mounts on a terminal invocation.
    - id: tui-startup
      name: 'deepseek-tui/startup'

    - id: deepseek-tui
      name: 'deepseek-tui'
